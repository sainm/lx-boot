statistics.group_export.suggestion=個人レベル: 高リスクの回答者または複数の異常な次元を持つ回答者に対して二次スクリーニングと面接を実施します。グループレベル: 感情管理、ストレス解消、リラクゼーショントレーニングを提供し、スクリーニング、介入、追跡のワークフローを確立します。フォローアップ: 介入効果を評価するために、主要な症例を 3 か月以内に再検査します。
