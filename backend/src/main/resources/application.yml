server:
  port: 8090

spring:
  application:
    name: psy-backend
  datasource:
    url: ${PSY_DB_URL:jdbc:postgresql://127.0.0.1:5432/auth_starter}
    username: ${PSY_DB_USERNAME:auth_starter_app}
    password: ${PSY_DB_PASSWORD:AuthStarter@2026}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${PSY_REDIS_HOST:127.0.0.1}
      port: ${PSY_REDIS_PORT:6379}
      database: ${PSY_REDIS_DATABASE:0}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-psy.sql

auth-module:
  enabled: true
  organization:
    mode: GROUP
    tenant-enabled: true
  authentication:
    enabled-types:
      - PASSWORD
      - WECHAT
  qr-login:
    enabled: false
  social:
    google:
      enabled: false
    wechat:
      enabled: false
  audit:
    enabled: true
    record-success-logins: true
    record-failed-logins: true
    record-access-denied: true
  security:
    jwt:
      secret: ${PSY_JWT_SECRET:change-me-change-me-change-me-change-me}
      issuer: org.sainm.psy-backend
      access-token-expire-minutes: 30
      refresh-token-expire-days: 7
    password:
      encoder: argon2
      min-length: 8
    lock-strategy:
      max-attempts: 5
      lock-duration-minutes: 30
      ip-max-attempts: 20
      captcha-threshold: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

psy:
  scheduler:
    lock:
      enabled: ${PSY_SCHEDULER_LOCK_ENABLED:true}
      key-prefix: ${PSY_SCHEDULER_LOCK_KEY_PREFIX:psy:scheduler:lock}
  scale:
    import:
      multi-select-enabled: true
      slider-enabled: true
      matrix-enabled: true
      text-with-option-enabled: true
      norm-scoring-enabled: true
      high-risk-rule-enabled: true
  assessment:
    draft-cleanup-scan-delay-ms: ${PSY_ASSESSMENT_DRAFT_CLEANUP_SCAN_DELAY_MS:3600000}
    draft-retention-days: ${PSY_ASSESSMENT_DRAFT_RETENTION_DAYS:30}
  export:
    jobs:
      max-in-memory-jobs: ${PSY_EXPORT_MAX_IN_MEMORY_JOBS:100}
      max-in-memory-file-bytes: ${PSY_EXPORT_MAX_IN_MEMORY_FILE_BYTES:10485760}
      file-storage-enabled: ${PSY_EXPORT_FILE_STORAGE_ENABLED:true}
      storage-dir: ${PSY_EXPORT_STORAGE_DIR:}
      processing-timeout-minutes: ${PSY_EXPORT_PROCESSING_TIMEOUT_MINUTES:30}
      pending-scan-delay-ms: ${PSY_EXPORT_PENDING_SCAN_DELAY_MS:60000}
      pending-batch-size: ${PSY_EXPORT_PENDING_BATCH_SIZE:20}
      artifact-storage:
        mode: ${PSY_EXPORT_ARTIFACT_STORAGE_MODE:LOCAL_PATH}
        base-dir: ${PSY_EXPORT_ARTIFACT_BASE_DIR:}
        key-prefix: ${PSY_EXPORT_ARTIFACT_KEY_PREFIX:export-artifacts}
        bucket: ${PSY_EXPORT_ARTIFACT_BUCKET:psy-export-artifacts}
        endpoint-url: ${PSY_EXPORT_ARTIFACT_ENDPOINT_URL:}
        api-key-header: ${PSY_EXPORT_ARTIFACT_API_KEY_HEADER:X-Api-Key}
        api-key: ${PSY_EXPORT_ARTIFACT_API_KEY:}
        connect-timeout-millis: ${PSY_EXPORT_ARTIFACT_CONNECT_TIMEOUT_MILLIS:5000}
  notification:
    delivery-scan-delay-ms: ${PSY_NOTIFICATION_DELIVERY_SCAN_DELAY_MS:60000}
    delivery-batch-size: ${PSY_NOTIFICATION_DELIVERY_BATCH_SIZE:100}
    deep-link:
      app-scheme: ${PSY_NOTIFICATION_DEEP_LINK_APP_SCHEME:}
      universal-link-base-url: ${PSY_NOTIFICATION_DEEP_LINK_UNIVERSAL_LINK_BASE_URL:}
    push:
      http:
        enabled: ${PSY_NOTIFICATION_PUSH_HTTP_ENABLED:false}
        endpoint-url: ${PSY_NOTIFICATION_PUSH_HTTP_ENDPOINT_URL:}
        authorization-token: ${PSY_NOTIFICATION_PUSH_HTTP_AUTHORIZATION_TOKEN:}
        provider-name: ${PSY_NOTIFICATION_PUSH_HTTP_PROVIDER_NAME:http}
  warning:
    escalation-scan-delay-ms: ${PSY_WARNING_ESCALATION_SCAN_DELAY_MS:60000}
    unclaimed-escalation-hours: ${PSY_WARNING_UNCLAIMED_ESCALATION_HOURS:24}
    processing-reminder-hours: ${PSY_WARNING_PROCESSING_REMINDER_HOURS:24}
