server:
  port: 8090

spring:
  application:
    name: psy-backend
  datasource:
    url: ${PSY_DB_URL:jdbc:postgresql://127.0.0.1:5432/auth_starter}
    username: ${PSY_DB_USERNAME:auth_starter_app}
    password: ${PSY_DB_PASSWORD:AuthStarter@2026}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${PSY_REDIS_HOST:127.0.0.1}
      port: ${PSY_REDIS_PORT:6379}
      database: ${PSY_REDIS_DATABASE:0}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-psy.sql

auth-module:
  enabled: true
  organization:
    mode: GROUP
    tenant-enabled: true
  authentication:
    enabled-types:
      - PASSWORD
      - WECHAT
  qr-login:
    enabled: false
  social:
    google:
      enabled: false
    wechat:
      enabled: false
  audit:
    enabled: true
    record-success-logins: true
    record-failed-logins: true
    record-access-denied: true
  security:
    jwt:
      secret: ${PSY_JWT_SECRET:change-me-change-me-change-me-change-me}
      issuer: org.sainm.psy-backend
      access-token-expire-minutes: 30
      refresh-token-expire-days: 7
    password:
      encoder: argon2
      min-length: 8
    lock-strategy:
      max-attempts: 5
      lock-duration-minutes: 30
      ip-max-attempts: 20
      captcha-threshold: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
