server:
  port: 8090

spring:
  application:
    name: psy-backend
  datasource:
    url: ${PSY_DB_URL:jdbc:postgresql://127.0.0.1:5432/lx}
    username: ${PSY_DB_USERNAME:lx}
    password: ${PSY_DB_PASSWORD:lx}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: ${PSY_DB_MAX_LIFETIME_MS:840000}
      keepalive-time: ${PSY_DB_KEEPALIVE_TIME_MS:300000}
      idle-timeout: ${PSY_DB_IDLE_TIMEOUT_MS:600000}
      connection-timeout: ${PSY_DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${PSY_DB_VALIDATION_TIMEOUT_MS:5000}
  data:
    redis:
      host: ${PSY_REDIS_HOST:127.0.0.1}
      port: ${PSY_REDIS_PORT:6379}
      password: ${PSY_REDIS_PASSWORD:lh}
      database: ${PSY_REDIS_DATABASE:0}
  sql:
    init:
      mode: ${PSY_SQL_INIT_MODE:never}
      encoding: UTF-8
      schema-locations: classpath:schema-psy.sql
      data-locations: classpath:data-psy.sql

auth-module:
  enabled: true
  organization:
    mode: GROUP
    tenant-enabled: true
  authentication:
    enabled-types:
      - PASSWORD
      - WECHAT
      - OIDC
      - CAS
  registration:
    self-service-enabled: ${PSY_AUTH_SELF_REGISTRATION_ENABLED:true}
  qr-login:
    enabled: false
  social:
    google:
      enabled: false
    wechat:
      enabled: ${PSY_AUTH_WECHAT_ENABLED:false}
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
      template-ids:
        task-remind: ${WECHAT_TPL_TASK_REMIND:}
        warning-alert: ${WECHAT_TPL_WARNING:}
        appointment-result: ${WECHAT_TPL_APPOINTMENT:}
  sso:
    # Absolute base URL of THIS backend, used to build the IdP callback URL.
    callback-base-url: ${PSY_AUTH_SSO_CALLBACK_BASE_URL:}
    # Frontend page that receives the one-time ticket and exchanges it for tokens.
    frontend-callback-url: ${PSY_AUTH_SSO_FRONTEND_CALLBACK_URL:}
    state-ttl-seconds: 300
    ticket-ttl-seconds: 120
    oidc:
      enabled: ${PSY_AUTH_SSO_OIDC_ENABLED:false}
      issuer: ${PSY_AUTH_SSO_OIDC_ISSUER:}
      authorization-endpoint: ${PSY_AUTH_SSO_OIDC_AUTHORIZATION_ENDPOINT:}
      token-endpoint: ${PSY_AUTH_SSO_OIDC_TOKEN_ENDPOINT:}
      jwk-set-uri: ${PSY_AUTH_SSO_OIDC_JWK_SET_URI:}
      client-id: ${PSY_AUTH_SSO_OIDC_CLIENT_ID:}
      client-secret: ${PSY_AUTH_SSO_OIDC_CLIENT_SECRET:}
      username-claim: ${PSY_AUTH_SSO_OIDC_USERNAME_CLAIM:sub}
    cas:
      enabled: ${PSY_AUTH_SSO_CAS_ENABLED:false}
      server-url: ${PSY_AUTH_SSO_CAS_SERVER_URL:}
      principal-attribute: ${PSY_AUTH_SSO_CAS_PRINCIPAL_ATTRIBUTE:}
  audit:
    enabled: true
    record-success-logins: true
    record-failed-logins: true
    record-access-denied: true
  device-governance:
    device-stale-days: 30
    session-stale-days: 30
    required-push-token-device-types:
      - ANDROID
      - IOS
    signal-policies:
      device-inactive:
        enabled: true
        risk-level: MEDIUM
        auto-disposition: REVIEW_ONLY
      push-token-missing:
        enabled: true
        risk-level: MEDIUM
        auto-disposition: REVIEW_ONLY
      auth-session-missing:
        enabled: true
        risk-level: MEDIUM
        auto-disposition: REVIEW_ONLY
      abnormal-auth-session-status:
        enabled: true
        risk-level: MEDIUM
        auto-disposition: REVIEW_ONLY
      auth-session-stale:
        enabled: true
        risk-level: HIGH
        auto-disposition: REVOKE_DEVICE_SESSIONS
      device-stale:
        enabled: true
        risk-level: HIGH
        auto-disposition: REVIEW_ONLY
      inactive-device-with-active-session:
        enabled: true
        risk-level: CRITICAL
        auto-disposition: REVOKE_DEVICE_SESSIONS
      active-device-without-active-session:
        enabled: true
        risk-level: HIGH
        auto-disposition: DEACTIVATE_DEVICE_AND_REVOKE_SESSIONS
  security:
    jwt:
      secret: ${PSY_JWT_SECRET:local-dev-only-change-this-jwt-secret}
      issuer: org.sainm.psy-backend
      access-token-expire-minutes: 30
      refresh-token-expire-days: 7
    password:
      encoder: argon2
      min-length: 8
    lock-strategy:
      max-attempts: 5
      lock-duration-minutes: 30
      ip-max-attempts: 20
      captcha-threshold: 3

  # Email delivery (SMTP). When spring.mail.host is blank the auth-starter
  # no-op MailSenderService remains; set it to enable real email delivery.
  mail:
    host: ${PSY_MAIL_HOST:}
    port: ${PSY_MAIL_PORT:587}
    username: ${PSY_MAIL_USERNAME:}
    password: ${PSY_MAIL_PASSWORD:}
    properties:
      from: ${PSY_MAIL_FROM:noreply@school.edu.cn}
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

psy:
  scheduler:
    lock:
      enabled: ${PSY_SCHEDULER_LOCK_ENABLED:true}
      key-prefix: ${PSY_SCHEDULER_LOCK_KEY_PREFIX:psy:scheduler:lock}
  scale:
    import:
      multi-select-enabled: true
      slider-enabled: true
      matrix-enabled: true
      text-with-option-enabled: true
      norm-scoring-enabled: true
      high-risk-rule-enabled: true
  assessment:
    draft-cleanup-scan-delay-ms: ${PSY_ASSESSMENT_DRAFT_CLEANUP_SCAN_DELAY_MS:3600000}
    draft-retention-days: ${PSY_ASSESSMENT_DRAFT_RETENTION_DAYS:30}
  export:
    jobs:
      max-in-memory-jobs: ${PSY_EXPORT_MAX_IN_MEMORY_JOBS:100}
      max-in-memory-file-bytes: ${PSY_EXPORT_MAX_IN_MEMORY_FILE_BYTES:10485760}
      file-storage-enabled: ${PSY_EXPORT_FILE_STORAGE_ENABLED:true}
      storage-dir: ${PSY_EXPORT_STORAGE_DIR:}
      processing-timeout-minutes: ${PSY_EXPORT_PROCESSING_TIMEOUT_MINUTES:30}
      pending-scan-delay-ms: ${PSY_EXPORT_PENDING_SCAN_DELAY_MS:60000}
      pending-batch-size: ${PSY_EXPORT_PENDING_BATCH_SIZE:20}
      artifact-storage:
        mode: ${PSY_EXPORT_ARTIFACT_STORAGE_MODE:LOCAL_PATH}
        base-dir: ${PSY_EXPORT_ARTIFACT_BASE_DIR:}
        key-prefix: ${PSY_EXPORT_ARTIFACT_KEY_PREFIX:export-artifacts}
        bucket: ${PSY_EXPORT_ARTIFACT_BUCKET:psy-export-artifacts}
        endpoint-url: ${PSY_EXPORT_ARTIFACT_ENDPOINT_URL:}
        api-key-header: ${PSY_EXPORT_ARTIFACT_API_KEY_HEADER:X-Api-Key}
        api-key: ${PSY_EXPORT_ARTIFACT_API_KEY:}
        connect-timeout-millis: ${PSY_EXPORT_ARTIFACT_CONNECT_TIMEOUT_MILLIS:5000}
  notification:
    delivery-scan-delay-ms: ${PSY_NOTIFICATION_DELIVERY_SCAN_DELAY_MS:60000}
    delivery-batch-size: ${PSY_NOTIFICATION_DELIVERY_BATCH_SIZE:100}
    deep-link:
      app-scheme: ${PSY_NOTIFICATION_DEEP_LINK_APP_SCHEME:}
      universal-link-base-url: ${PSY_NOTIFICATION_DEEP_LINK_UNIVERSAL_LINK_BASE_URL:}
    push:
      fcm:
        enabled: ${PSY_NOTIFICATION_PUSH_FCM_ENABLED:false}
        project-id: ${PSY_NOTIFICATION_PUSH_FCM_PROJECT_ID:}
        service-account-json: ${PSY_NOTIFICATION_PUSH_FCM_SERVICE_ACCOUNT_JSON:}
        service-account-file: ${PSY_NOTIFICATION_PUSH_FCM_SERVICE_ACCOUNT_FILE:}
        api-base-url: ${PSY_NOTIFICATION_PUSH_FCM_API_BASE_URL:https://fcm.googleapis.com}
        scope: ${PSY_NOTIFICATION_PUSH_FCM_SCOPE:https://www.googleapis.com/auth/firebase.messaging}
      http:
        enabled: ${PSY_NOTIFICATION_PUSH_HTTP_ENABLED:false}
        endpoint-url: ${PSY_NOTIFICATION_PUSH_HTTP_ENDPOINT_URL:}
        authorization-token: ${PSY_NOTIFICATION_PUSH_HTTP_AUTHORIZATION_TOKEN:}
        provider-name: ${PSY_NOTIFICATION_PUSH_HTTP_PROVIDER_NAME:http}
    wechat:
      enabled: ${PSY_NOTIFICATION_WECHAT_ENABLED:false}
      template-id: ${PSY_NOTIFICATION_WECHAT_TEMPLATE_ID:}
  warning:
    escalation-scan-delay-ms: ${PSY_WARNING_ESCALATION_SCAN_DELAY_MS:60000}
    unclaimed-escalation-hours: ${PSY_WARNING_UNCLAIMED_ESCALATION_HOURS:24}
    processing-reminder-hours: ${PSY_WARNING_PROCESSING_REMINDER_HOURS:24}
  external-registration:
    activation-base-url: ${PSY_EXTERNAL_REGISTRATION_ACTIVATION_BASE_URL:}
    approval-notify-subject: ${PSY_EXTERNAL_REGISTRATION_APPROVAL_SUBJECT:Your account has been approved}
    rejection-notify-subject: ${PSY_EXTERNAL_REGISTRATION_REJECTION_SUBJECT:Your registration was not approved}
