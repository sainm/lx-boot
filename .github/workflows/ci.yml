name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  admin-web:
    name: Admin Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lx-boot/admin-web
    steps:
      - name: Checkout lx-boot
        uses: actions/checkout@v4
        with:
          path: lx-boot

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: lx-boot/admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: psy_ci
          POSTGRES_USER: psy_ci
          POSTGRES_PASSWORD: psy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psy_ci -d psy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PSY_POSTGRES_INTEGRATION: "true"
      PSY_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/psy_ci
      PSY_TEST_DB_USERNAME: psy_ci
      PSY_TEST_DB_PASSWORD: psy_ci
    defaults:
      run:
        working-directory: lx-boot/backend
    steps:
      - name: Checkout lx-boot
        uses: actions/checkout@v4
        with:
          path: lx-boot

      - name: Checkout auth-starter
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AUTH_STARTER_REPOSITORY || format('{0}/auth-starter', github.repository_owner) }}
          ref: ${{ vars.AUTH_STARTER_REF || '0e518be600774018b2defd84df6068a5e1f93dd1' }}
          token: ${{ secrets.AUTH_STARTER_TOKEN || github.token }}
          path: auth-starter

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

  android:
    name: Android Respondent App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lx-boot/android-app
    steps:
      - name: Checkout lx-boot
        uses: actions/checkout@v4
        with:
          path: lx-boot

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Lint, test and assemble
        run: |
          chmod +x ./gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug
